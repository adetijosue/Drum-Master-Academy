<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe | DRUM MASTER ACADEMY</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #141414 0%, #050505 100%);
            padding: 2rem;
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-dark);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gold-gradient);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-logo {
            width: 80px;
            margin-bottom: 1.5rem;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            transition: var(--transition-fast);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(214, 163, 47, 0.2);
        }

        .auth-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 1rem;
            font-size: 1rem;
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            border: 1px solid rgba(255, 68, 68, 0.2);
            text-align: center;
        }

        .success-card {
            display: none;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        .success-icon {
            font-size: 4rem;
            color: #22c55e;
            margin-bottom: 1.5rem;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 0.8; }
            70% { transform: scale(0.9); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Form Card -->
        <div class="auth-card" id="form-card">
            <div class="auth-header">
                <img src="assets/images/logo.jpg" alt="DMA Logo" class="auth-logo">
                <h2>Nouveau <span class="text-gold">Mot de passe</span></h2>
                <p id="user-email-subtitle">Réinitialisation de votre accès</p>
            </div>

            <div id="error-box" class="error-message"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="password">Nouveau mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimum 6 caractères" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmer le mot de passe</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Ressaisir le mot de passe" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary auth-btn">Mettre à jour le mot de passe 🔒</button>
            </form>
        </div>

        <!-- Success Display -->
        <div class="auth-card success-card" id="success-card">
            <div class="success-icon">✓</div>
            <h2>Sécurisé !</h2>
            <p style="color: var(--text-secondary); margin: 1rem 0 2rem 0; font-size: 1.05rem;">
                Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter à votre espace étudiant.
            </p>
            <a href="login.html" class="btn btn-primary" style="display: block; text-align: center; padding: 1rem;">
                Me connecter à mon espace 🚀
            </a>
        </div>
    </div>

    <script src="assets/js/auth-core.js"></script>
    <script>
        // Parse email parameter from URL query string
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const errorBox = document.getElementById('error-box');

        // Redirect if there is no valid email parameter
        if (!email) {
            alert("Accès non autorisé. Paramètre d'e-mail manquant.");
            window.location.href = 'login.html';
        } else {
            document.getElementById('user-email-subtitle').textContent = `Compte associé : ${decodeURIComponent(email)}`;
        }

        document.getElementById('reset-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const formCard = document.getElementById('form-card');
            const successCard = document.getElementById('success-card');

            errorBox.style.display = 'none';

            // Validate match
            if (password !== confirmPassword) {
                errorBox.textContent = "Les mots de passe ne correspondent pas.";
                errorBox.style.display = 'block';
                return;
            }

            // Save new password
            const result = await AuthCore.resetPassword(email, password);
            if (result.success) {
                formCard.style.display = 'none';
                successCard.style.display = 'block';
            } else {
                errorBox.textContent = result.message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
